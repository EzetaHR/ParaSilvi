<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para ti</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💐</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--mono:'VT323','Courier New',monospace}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--mono);color:var(--tx);background:var(--bg);background-attachment:fixed;text-align:center;overflow-x:hidden;transition:background .5s}
body[data-t=neon]{--bg:linear-gradient(180deg,#0a0a33,#1b1a6b 70%,#2a2290);--tx:#e8e6ff;--ac:#ff5fd2;--card:rgba(10,10,50,.7);--bd:rgba(255,95,210,.45)}
body[data-t=crt]{--bg:#020a04;--tx:#43ff7a;--ac:#43ff7a;--card:rgba(2,20,8,.8);--bd:rgba(67,255,122,.5)}
body[data-t=crt]::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:3;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px)}
body[data-t=synth]{--bg:linear-gradient(180deg,#14082b,#4a1260 60%,#c2307a);--tx:#ffe3f6;--ac:#2de2e6;--card:rgba(30,8,50,.7);--bd:rgba(45,226,230,.5)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.stage{max-width:540px;margin:0 auto;padding:18px 12px 140px;position:relative;z-index:2}
.sub{font-size:20px;opacity:.7;letter-spacing:.1em}
h1{font-weight:400;font-size:clamp(40px,11vw,60px);margin:.05em 0;color:var(--ac);text-shadow:0 0 14px var(--ac);line-height:1}
#bq{display:block;margin:6px auto 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:16px 16px 14px;margin:12px 4px;box-shadow:0 0 24px -6px var(--ac);text-align:left}
#msg{font-size:clamp(22px,5.6vw,27px);line-height:1.25;white-space:pre-line;min-height:6.5em;margin:0}
#msg::after{content:"█";margin-left:2px;color:var(--ac);animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
#sig{font-size:30px;color:var(--ac);margin-top:8px;text-align:right}
#cnt{font-size:22px;opacity:.9;text-align:right}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--bd)}
button{font:inherit;font-size:21px;border:1px solid var(--ac);background:transparent;color:var(--tx);padding:4px 12px;cursor:pointer}
button.on{background:var(--ac);color:#000}
.panel{position:fixed;left:10px;right:10px;bottom:calc(84px + env(safe-area-inset-bottom,0px));max-height:58vh;overflow:auto;z-index:6;display:none;text-align:left;background:var(--card);border:1px solid var(--bd);padding:12px 16px;max-width:520px;margin:0 auto}
.panel.open{display:block}
body:not(.edit) #bEdit,body:not(.edit) #bCopy{display:none}
label{display:block;font-size:20px;margin:8px 0 2px}
input,textarea{width:100%;font-family:inherit;font-size:20px;padding:6px 9px;border:1px solid var(--bd);background:rgba(0,0,0,.55);color:var(--tx)}
textarea{min-height:130px;resize:vertical}
</style>
</head>
<body data-t="neon">
<canvas id="fx"></canvas>
<div class="stage">
  <div class="sub">~$ para_ti.exe</div>
  <h1 id="para"></h1>
  <canvas id="bq" aria-label="Ramo de flores hecho con caracteres, girando"></canvas>
  <div class="card">
    <p id="msg"></p>
    <div id="sig"></div>
    <div id="cnt"></div>
  </div>
</div>

<div class="panel" id="panel">
  <label>Su nombre o apodo</label><input id="i_para">
  <label>Mensaje (cada salto de línea es un párrafo)</label><textarea id="i_msg"></textarea>
  <label>Firma</label><input id="i_sig">
  <label>Juntos desde (opcional, activa el contador de días)</label><input id="i_desde" type="date">
</div>

<div class="bar">
  <button data-s="neon">Neón</button>
  <button data-s="crt">Terminal</button>
  <button data-s="synth">Distinto</button>
  <button id="bEdit">✎ Editar</button>
  <button id="bCopy">⧉ Copiar CONFIG</button>
  <button id="bPlay">↻ Reescribir</button>
</div>

<script>
/* ============================================================
   EDITA AQUÍ: textos por defecto.
   estilo: "neon" | "crt" | "synth"
   desde: fecha "2024-02-14" (o "" para ocultar el contador)
   ============================================================ */
const CONFIG = {
  para: "Mi amor",
  mensaje: "Quería regalarte flores que no se marchitaran nunca,\nasí que las he hecho yo, letra a letra.\nGiran, crecen y te esperan siempre aquí.\nTe amo muchísimo.",
  firma: "Siempre tuyo",
  desde: "",
  estilo: "neon"
};

/* ---------- estilos: cambian colores, glifos y forma de las flores ---------- */
const THEMES = {
  neon:  { pal: ['#ff5fd2','#ffd23f','#9b5cff','#f5f5ff','#ff8a3d','#4de1ff'], ramp: '@#%+-:', pet: [6,8,5,7,6,5], p: .7,  paper: '#cdb98c', stem: '#43d06a', heart: '#ff4d6d' },
  crt:   { pal: ['#43ff7a','#b6ffc9','#1fc653','#8dffab','#43ff7a','#1fc653'], ramp: 'O0o*+.', pet: [8,8,8,8,8,8], p: 1,   paper: '#1b8a3d', stem: '#1fc653', heart: '#b6ffc9' },
  synth: { pal: ['#ff2d95','#2de2e6','#ff9f1c','#b967ff','#fff3a3','#ff2d95'], ramp: '█▓▒░░:', pet: [5,5,5,5,5,5], p: 2.2, paper: '#f2a6c8', stem: '#2de2e6', heart: '#fff3a3' }
};

// Modo edición: abre la página añadiendo ?editar al final de la dirección.
// Sin eso, ella solo ve lo que pone en CONFIG (el editor y los cambios locales quedan ocultos).
const EDIT = /[?&#]editar/.test(location.search + location.hash);
if (EDIT) document.body.classList.add('edit');
let C = Object.assign({}, CONFIG);
if (EDIT) try { const s = localStorage.getItem('ramoAscii'); if (s) Object.assign(C, JSON.parse(s)); } catch (e) {}
const save = () => { if (!EDIT) return; try { localStorage.setItem('ramoAscii', JSON.stringify(C)); } catch (e) {} };
const $ = id => document.getElementById(id);

/* ---------- ramo en caracteres ---------- */
const COLS = 60, ROWS = 50, ASP = 1.9;
const cv = $('bq'), ctx = cv.getContext('2d');
let cw, chh;
const g = new Array(COLS * ROWS).fill(''), gc = new Array(COLS * ROWS).fill('');
const F = [[30,16,9],[14,23,8],[46,23,8],[21,8,6.5],[40,8,6.5],[30,3,4.2]]; // x, y, radio
const put = (x, y, c, col) => { x = Math.round(x); y = Math.round(y); if (x < 0 || y < 0 || x >= COLS || y >= ROWS) return; g[y * COLS + x] = c; gc[y * COLS + x] = col; };

function size() {
  const W = Math.min(innerWidth - 24, 520), d = devicePixelRatio || 1;
  cw = W / COLS; chh = cw * ASP;
  cv.style.width = W + 'px'; cv.style.height = ROWS * chh + 'px';
  cv.width = W * d; cv.height = ROWS * chh * d;
  ctx.setTransform(d, 0, 0, d, 0, 0); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  fx.width = innerWidth * d; fx.height = innerHeight * d; fxc.setTransform(d, 0, 0, d, 0, 0);
}

function bloom(f, k, t, th, R, n, ang0, layer) {
  const p = th.pal, ramp = th.ramp, L = ramp.length;
  for (let y = Math.floor(f[1] - R / ASP - 1); y <= f[1] + R / ASP + 1; y++)
    for (let x = Math.floor(f[0] - R - 1); x <= f[0] + R + 1; x++) {
      const dx = x - f[0], dy = (y - f[1]) * ASP, r = Math.hypot(dx, dy);
      if (r > R) continue;
      const a = Math.atan2(dy, dx), lim = R * (.45 + .55 * Math.pow(Math.abs(Math.cos(n / 2 * (a - ang0))), th.p));
      if (r >= lim) continue;
      const q = r / lim;
      if (layer === 0) put(x, y, ramp[Math.min(L - 1, Math.floor(q * L))], q > .72 ? p[(k + 1) % p.length] : p[k % p.length]);
      else put(x, y, ramp[Math.min(2, Math.floor(q * 3))], p[(k + 2) % p.length]);
    }
}

function frame(t) {
  const th = THEMES[C.estilo] || THEMES.neon; g.fill('');
  // tallos en abanico
  F.forEach(f => {
    const bx = 30, by = 34, s = (f[0] - bx) / (by - f[1]);
    for (let i = 0; i <= 70; i++) put(bx + (f[0] - bx) * i / 70, by + (f[1] - by) * i / 70, Math.abs(s) < .25 ? '|' : s > 0 ? '/' : '\\', th.stem);
  });
  // papel de envolver
  for (let y = 32; y < 50; y++) for (let x = 30 - (49 - y) - 2; x <= 30 + (49 - y) + 2; x++)
    put(x, y, (x + y) % 2 ? '#' : '=', (x * 7 + y * 3) % 5 ? th.paper : th.paper + 'aa');
  // corazón en el papel
  for (let dy = -6; dy <= 6; dy++) for (let dx = -8; dx <= 8; dx++) {
    const X = dx / 6, Y = -dy / 5.2;
    if (Math.pow(X * X + Y * Y - 1, 3) - X * X * Y * Y * Y < 0) put(30 + dx, 41 + dy, '@', th.heart);
  }
  // flores giratorias (capa exterior y capa interior en sentido contrario)
  F.forEach((f, k) => {
    const dir = k % 2 ? -1 : 1, a = t / 1000 * .8 * dir * (1 + k * .08), n = th.pet[k];
    bloom(f, k, t, th, f[2], n, a, 0);
    bloom(f, k, t, th, f[2] * .55, n, -a * 1.4, 1);
    put(f[0], f[1], 'o', th.pal[3]);
  });
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.font = `bold ${cw * 1.6}px 'Courier New',monospace`;
  let last = '';
  for (let i = 0; i < g.length; i++) if (g[i]) {
    if (gc[i] !== last) ctx.fillStyle = last = gc[i];
    ctx.fillText(g[i], (i % COLS) * cw + cw / 2, Math.floor(i / COLS) * chh + chh / 2);
  }
}

/* ---------- corazones y destellos de fondo ---------- */
const fx = $('fx'), fxc = fx.getContext('2d');
const hearts = [], sparks = [];
const mk = (tmp, x, y) => ({ x: x ?? Math.random() * innerWidth, y: y ?? Math.random() * innerHeight, s: 10 + Math.random() * 14, v: .3 + Math.random() * .6, ph: Math.random() * 6, tmp });
function fxDraw(t) {
  const th = THEMES[C.estilo] || THEMES.neon;
  fxc.clearRect(0, 0, innerWidth, innerHeight); fxc.textAlign = 'center'; fxc.textBaseline = 'middle';
  sparks.forEach((s, i) => { fxc.globalAlpha = .25 + .75 * Math.abs(Math.sin(t / 700 + s.ph)); fxc.fillStyle = th.pal[i % th.pal.length]; fxc.font = `${s.s}px monospace`; fxc.fillText('+', s.x, s.y); });
  fxc.fillStyle = th.heart; fxc.globalAlpha = .8;
  for (let i = hearts.length - 1; i >= 0; i--) {
    const h = hearts[i]; h.y -= h.v; h.x += Math.sin(t / 900 + h.ph) * .4;
    if (h.y < -20) { if (h.tmp) { hearts.splice(i, 1); continue; } h.y = innerHeight + 20; }
    fxc.font = h.s + 'px monospace'; fxc.fillText('♥', h.x, h.y);
  }
  fxc.globalAlpha = 1;
}
for (let i = 0; i < 26; i++) hearts.push(mk(false));
for (let i = 0; i < 70; i++) sparks.push({ x: Math.random() * innerWidth, y: Math.random() * innerHeight, s: 10 + Math.random() * 8, ph: Math.random() * 6 });
document.addEventListener('pointerdown', e => { if (e.target.closest('.bar,.panel')) return; for (let i = 0; i < 8; i++) hearts.push(mk(true, e.clientX + Math.random() * 50 - 25, e.clientY + Math.random() * 30)); });

/* ---------- textos ---------- */
let T;
function typeMsg() { clearInterval(T); const el = $('msg'), t = C.mensaje; let i = 0; el.textContent = ''; T = setInterval(() => { el.textContent = t.slice(0, ++i); if (i >= t.length) clearInterval(T); }, 45); }
function render(instant) {
  $('para').textContent = '> ' + C.para; $('sig').textContent = '— ' + C.firma;
  document.body.dataset.t = C.estilo;
  document.querySelectorAll('[data-s]').forEach(b => b.classList.toggle('on', b.dataset.s === C.estilo));
  const el = $('cnt'); el.textContent = '';
  if (C.desde) { const d = Math.floor((Date.now() - new Date(C.desde + 'T00:00:00')) / 864e5); if (d >= 0) el.textContent = `[ ${d} días juntos ♥ ]`; }
  if (instant) { clearInterval(T); $('msg').textContent = C.mensaje; } else typeMsg();
}

/* ---------- controles ---------- */
document.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { C.estilo = b.dataset.s; save(); render(true); });
$('bEdit').onclick = () => { const p = $('panel'); p.classList.toggle('open'); $('bEdit').classList.toggle('on', p.classList.contains('open')); };
$('bPlay').onclick = () => render(false);
$('bCopy').onclick = async () => {
  const j = JSON.stringify({ para: C.para, mensaje: C.mensaje, firma: C.firma, desde: C.desde, estilo: C.estilo }, null, 2);
  try { await navigator.clipboard.writeText(j); $('bCopy').textContent = '✓ Copiado'; } catch (e) { prompt('Copia esto y pégalo en CONFIG:', j); }
};
$('i_para').value = C.para; $('i_msg').value = C.mensaje; $('i_sig').value = C.firma; $('i_desde').value = C.desde;
[['i_para','para'],['i_msg','mensaje'],['i_sig','firma'],['i_desde','desde']].forEach(([id, k]) => $(id).addEventListener('input', e => { C[k] = e.target.value; save(); render(true); }));

size(); addEventListener('resize', size); render(false);
let lt = 0;
(function loop(t) { requestAnimationFrame(loop); if (t - lt < 45) return; lt = t; frame(t); fxDraw(t); })(0);
</script>
</body>
</html>
